name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    # Push and pull request runs start once the repository is public, where hosted minutes are
    # free. Manual and release runs always start.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [pg, better-sqlite3]
    env:
      ACCOUNT_KIT_ALPHA: ${{ vars.ACCOUNT_KIT_ALPHA }}
      DB_CLIENT: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: masquerade_test
    services:
      postgres:
        image: ${{ matrix.database == 'pg' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: masquerade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/native-session/pnpm-lock.yaml
            examples/inertia-react/pnpm-lock.yaml
            examples/inertia-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: ${{ matrix.database == 'better-sqlite3' }}
        run: pnpm typecheck
      - name: Test demo launcher
        if: ${{ matrix.database == 'better-sqlite3' }}
        run: pnpm test:demo
      - name: Check documented native-session recipe
        if: ${{ matrix.database == 'better-sqlite3' }}
        run: pnpm test:recipe --database=sqlite
      - name: Test built package exports
        if: ${{ matrix.database == 'better-sqlite3' }}
        run: pnpm test:built-exports
      - run: pnpm test:coverage
      - name: Build documentation for pull requests
        if: ${{ github.event_name == 'pull_request' && matrix.database == 'better-sqlite3' }}
        run: pnpm docs:build
      - name: Install native-session example
        if: ${{ github.event_name == 'pull_request' && matrix.database == 'better-sqlite3' }}
        working-directory: examples/native-session
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        if: ${{ github.event_name == 'pull_request' && matrix.database == 'better-sqlite3' }}
        working-directory: examples/native-session
        run: pnpm dlx playwright@1.60.0 install --with-deps chromium
      - name: Run browser suite
        if: ${{ github.event_name == 'pull_request' && matrix.database == 'better-sqlite3' }}
        working-directory: examples/native-session
        env:
          DB_CLIENT: sqlite
          HOST: 127.0.0.1
          PORT: 3391
          SESSION_DRIVER: memory
        run: |
          pnpm test:browser
          pnpm test:browser
      - name: Check runnable Inertia React example
        if: ${{ github.event_name == 'pull_request' && matrix.database == 'better-sqlite3' }}
        env:
          DB_CLIENT: sqlite
          HOST: 127.0.0.1
          PORT: 3393
          SESSION_DRIVER: memory
        run: pnpm test:inertia-react
      - name: Check Inertia Vue example
        if: ${{ github.event_name == 'pull_request' && matrix.database == 'better-sqlite3' }}
        env:
          DB_CLIENT: sqlite
          HOST: 127.0.0.1
          PORT: 3378
          SESSION_DRIVER: memory
        run: pnpm test:inertia-vue
      - uses: actions/checkout@v7
        if: ${{ env.ACCOUNT_KIT_ALPHA == '' }}
        with:
          repository: Kevinjohn/oss-adonisjs-account-kit
          ref: b2814006b83673346fb5533db8b3443a067d7d6c
          path: tmp/account-kit-source
      - name: Exercise packed Account Kit consumer
        env:
          ACCOUNT_KIT_ALPHA: ${{ vars.ACCOUNT_KIT_ALPHA }}
          ACCOUNT_KIT_SOURCE: ${{ vars.ACCOUNT_KIT_ALPHA == '' && format('{0}/tmp/account-kit-source', github.workspace) || '' }}
          ACCOUNT_KIT_EVIDENCE_DIR: ${{ github.workspace }}/tmp/account-kit-evidence-${{ matrix.database }}
          ACCOUNT_KIT_PG_EXTERNAL: '1'
        run: pnpm test:account-kit --profile=all --database=${{ matrix.database == 'pg' && 'pg' || 'sqlite' }} --strategy=all --session-management=all
      - name: Upload Account Kit consumer evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: account-kit-${{ matrix.database }}
          path: |
            tmp/account-kit-evidence-${{ matrix.database }}/evidence.json
            tmp/account-kit-evidence-${{ matrix.database }}/logs/**
          if-no-files-found: warn
