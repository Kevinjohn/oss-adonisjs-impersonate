name: consumer

on:
  workflow_call:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [floor, latest]
        database: [sqlite, pg]
    services:
      postgres:
        image: ${{ matrix.database == 'pg' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: account_kit
          POSTGRES_PASSWORD: consumer_test
          POSTGRES_DB: account_kit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONSUMER_PG_EXTERNAL: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: account_kit
      DB_PASSWORD: consumer_test
      DB_DATABASE: account_kit_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test packed native-session consumer
        run: pnpm test:consumer --profile=${{ matrix.profile }} --database=${{ matrix.database }}
